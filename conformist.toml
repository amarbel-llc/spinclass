# conformist configuration (treefmt successor): the goimports -> gofumpt -> nixfmt
# -> shfmt formatter chain (plus tommy fmt for TOML) that produces this repo's
# canonical formatting, plus linters conformist runs natively (shellcheck).
# Run via `conformist` (repair) /
# `conformist check`. Wired as the flake `formatter` and gated by `just lint-fmt`.

# Generated / locked / prose / hand-formatted — not formatted.
excludes = [
  "flake.lock",
  "go.sum",
  "gomod2nix.toml",
  "sweatfile",
  "LICENSE",
  "*.md",
  "result",
  "result-*",
  ".tmp/**",
  # Generated by tommy; regenerate via `just gen-tommy`, never hand-format.
  "internal/sweatfile/sweatfile_tommy.go",
  # roff manpage sources are hand-maintained; no formatter owns them.
  "cmd/spinclass/doc/*",
  # conformist's own config is TOML with intentional layout; leave it be.
  "conformist.toml",
]

# Go: goimports (priority 1) must run before gofumpt (priority 2) so the
# import-grouped output is re-canonicalized by gofumpt. -w so each writes in
# place (required for conformist's sandbox check to observe drift).
[formatter.goimports]
command = "goimports"
options = ["-w"]
includes = ["*.go"]
priority = 1

[formatter.gofumpt]
command = "gofumpt"
options = ["-w"]
includes = ["*.go"]
priority = 2

[formatter.nixfmt]
command = "nixfmt"
includes = ["*.nix"]

# Project shell style: 2-space indent, simplify, case-branch indent. -w writes.
[formatter.shfmt]
command = "shfmt"
options = ["-w", "-i", "2", "-s", "-ci"]
includes = ["*.sh", "*.bash", "*.bats"]

# TOML: tommy fmt owns *.toml in place (conformist passes matched files
# positionally -> `tommy fmt <files...>`). `*` crosses `/` in conformist's
# globs, so one pattern covers nested files. The repo's only .toml files
# (conformist.toml, gomod2nix.toml) are excluded, so this is forward-looking
# wiring for future TOML rather than a reformat of today's tree.
[formatter.tommy]
command = "tommy"
options = ["fmt"]
includes = ["*.toml"]

# Linter: shellcheck runs read-only in `conformist check` (no autofix).
[linter.shellcheck]
command = "shellcheck"
includes = ["*.sh", "*.bash", "*.bats"]

# tommy codegen driver (tommy v0.4.6 conformist-tommy-codegen). Run-once,
# whole-tree: passes-files=false means conformist invokes repair-command ONCE
# with no file args; the driver does its own walk for //go:generate tommy
# generate and regenerates per directive. includes=["*.go"] only GATES whether
# the linter fires. check is a deliberate no-op (command="true"): tommy's own
# --check diverges from the gofumpt'd committed codec and needs `go` on PATH, so
# it would false-flag; the REPAIR lane (conformist / `just fmt`) regenerates.
# NOTE: because check is a no-op this AUTOMATES regen but does NOT enforce drift
# in `conformist check`; the enforcing #159 guard (regen + git diff --exit-code)
# is separate. The driver bakes its own v0.4.6 tommy; it needs `go` ambient and
# self-skips (exit 0) when go/tommy are absent (e.g. a sandboxed check lane).
[linter.tommy-codegen]
command = "true"
repair-command = "conformist-tommy-codegen"
includes = ["*.go"]
passes-files = false

# go vet, run-once over the whole module. passes-files=false: conformist
# invokes `go vet ./...` ONCE with no file args (go vet is package-oriented,
# not per-file). includes=["*.go"] only GATES whether it fires. No autofix, so
# no repair-command — `conformist check` runs it and fails on vet findings.
# This folds the former `just lint-vet` into the single conformist gate.
[linter.govet]
command = "go"
options = ["vet", "./..."]
includes = ["*.go"]
passes-files = false
